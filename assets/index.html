<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>知识回响 · 3D 资产库</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f3fb;color:#28243c;font:14px/1.65 system-ui,sans-serif}header{padding:18px 5vw;background:#fff;border-bottom:1px solid #e4def1;display:flex;justify-content:space-between;align-items:center}a{color:#7658c9;text-decoration:none}main{max-width:1220px;margin:auto;padding:30px 24px}h1{margin:0 0 5px;font-size:29px}p{color:#77708b;margin:4px 0 16px}.layout{display:grid;grid-template-columns: minmax(250px,340px) minmax(0,1fr);gap:20px}.panel{background:white;border:1px solid #e5dff0;border-radius:18px;padding:18px;box-shadow:0 8px 24px #32205d09}.list{display:grid;gap:8px;margin-top:15px}button{font:inherit;color:inherit;background:#f8f6fc;border:1px solid #e9e3f4;border-radius:10px;text-align:left;padding:10px 12px;cursor:pointer}button:hover,button.on{border-color:#a18ae1;background:#f0eafb}button small{display:block;color:#817995}select{font:inherit;width:100%;padding:8px;border:1px solid #e5dff0;border-radius:8px;background:white}#stage{height:440px;position:relative;overflow:hidden;border-radius:12px;background:radial-gradient(ellipse at 50% 30%,#f9f6ff,#e9e3f2)}#stage canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:absolute;left:14px;top:12px;color:#756989;pointer-events:none}h2{font-size:20px;margin:0 0 8px}.meta{font-size:13px;overflow-wrap:anywhere;margin-top:15px}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}.tools button{padding:6px 12px}.tag{color:#8a73bd;font-size:12px} @media(max-width:760px){.layout{grid-template-columns:1fr}#stage{height:340px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><strong>知识回响 / 3D 资产库</strong><a href="../">返回原型 ↗</a></header><main><h1>知识资产工作台</h1><p>可复用基础资产 · 独立模型预览 · 专业知识素材待补充</p><div class="layout"><section class="panel"><h2>资产目录</h2><select id="filter" aria-label="分类"><option value="all">全部分类</option><option value="character">人物</option><option value="book">书本</option><option value="prop">道具</option><option value="environment">场景</option><option value="knowledge">专业知识</option></select><div id="list" class="list"></div></section><section class="panel"><h2 id="title">选择资产</h2><div id="stage"><div id="status" role="status">正在初始化预览…</div></div><div class="tools"><button id="reset">重置视角</button><a id="modelLink" hidden>打开模型文件 ↗</a><span class="tag">拖动旋转 · 滚轮缩放</span></div><div class="meta" id="meta"></div></section></div></main>
<script type="module">
const q=s=>document.querySelector(s),list=q('#list'),status=q('#status');let all=[],active=null,viewer=null,selection=0;function msg(s){status.textContent=s}
function renderList(){list.replaceChildren();for(const a of all.filter(a=>q('#filter').value==='all'||a.kind===q('#filter').value)){const b=document.createElement('button');b.className=a.id===active?.id?'on':'';const t=document.createElement('strong'),n=document.createElement('small');t.textContent=a.title;n.textContent=a.status==='pending'?'待补充 · '+a.id:a.status==='approved'?'已验收 · '+a.id:'基础模型 · '+a.id;b.append(t,n);b.onclick=()=>select(a);list.append(b)}}
async function select(a){const token=++selection;active=a;renderList();q('#title').textContent=a.title;q('#meta').textContent=[a.status==='pending'?'待补充：'+(a.requirements||'待确认'):'来源：'+a.source,a.license?'许可：'+a.license:'',a.review?'验收：'+a.review:''].filter(Boolean).join(' ｜ ');const link=q('#modelLink');link.hidden=!a.path;if(a.path)link.href=a.path;if(viewer)viewer.clear();if(!a.path){msg('此资产尚未入库');return}if(!viewer){msg('模型渲染器尚未就绪或无法连接 CDN；仍可打开模型文件。');return}msg('正在加载模型…');try{const obj=await viewer.load(a.path);if(token!==selection){viewer.dispose(obj);return}viewer.show(obj);msg('')}catch(e){if(token===selection)msg('加载失败：'+e.message)}}
q('#filter').onchange=renderList;q('#reset').onclick=()=>viewer?.reset();try{const res=await fetch('./catalog.json');if(!res.ok)throw Error(res.status);all=(await res.json()).assets;renderList();if(all.length)select(all[0])}catch(e){msg('目录加载失败：'+e.message)}
try{const THREE=await import('three'),{OrbitControls}=await import('three/addons/controls/OrbitControls.js'),{GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');const host=q('#stage'),r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor(0,0);host.prepend(r.domElement);const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(38,1,.01,100),controls=new OrbitControls(cam,r.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0xa89ab8,2.2));const l=new THREE.DirectionalLight(0xfff2dc,3);l.position.set(3,6,4);scene.add(l);const fill=new THREE.DirectionalLight(0xc9c1ff,1);fill.position.set(-4,2,-3);scene.add(fill);let model=null,center=new THREE.Vector3(),size=1;const loader=new GLTFLoader();
function dispose(obj){const gs=new Set(),ms=new Set();obj.traverse(o=>{if(o.geometry)gs.add(o.geometry);if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>ms.add(m))});gs.forEach(g=>g.dispose());ms.forEach(m=>m.dispose())}
function clear(){if(model){scene.remove(model);dispose(model);model=null}}function reset(){controls.target.copy(center);cam.position.copy(center).add(new THREE.Vector3(1.4,1.0,1.65).normalize().multiplyScalar(size*2.9));cam.near=Math.max(.001,size/1000);cam.far=size*100;cam.updateProjectionMatrix();controls.update()}
viewer={clear,dispose,reset,load:async path=>(await loader.loadAsync(path)).scene,show(obj){model=obj;scene.add(obj);const b=new THREE.Box3().setFromObject(obj);b.getCenter(center);const s=b.getSize(new THREE.Vector3());size=Math.max(s.x,s.y,s.z,.1);reset()}};new ResizeObserver(()=>{r.setSize(host.clientWidth,host.clientHeight,false);cam.aspect=host.clientWidth/Math.max(1,host.clientHeight);cam.updateProjectionMatrix()}).observe(host);r.setAnimationLoop(()=>{controls.update();r.render(scene,cam)});if(active)select(active);else msg('请选择模型')
}catch(e){msg('无法初始化 3D 预览（CDN 或 WebGL 不可用），目录仍可使用。')}
</script></body></html>
